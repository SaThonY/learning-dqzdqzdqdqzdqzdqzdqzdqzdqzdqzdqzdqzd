<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Comprendre sa prière mot à mot et apprendre les invocations du Prophète ﷺ avec des cartes de révision et un mode voiture.">
<meta name="theme-color" content="#F2F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1423" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prière">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Prière mot à mot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Scheherazade+New:wght@400;700&family=Young+Serif&display=swap">
<style>
/* Layout : une colonne de carnet de poche (36rem max), onglets en bas, panneaux plein écran pour les cartes, la voiture et les fiches. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#E9EFF6; --ink:#13233A; --muted:#58667A; --line:#D6DFEA;
  --accent:#1F4E9E; --accent-ink:#FFFFFF; --accent-soft:#E1E9F7;
  --turq:#0F7873; --turq-soft:#DCF0EE; --amber:#A4600C; --amber-soft:#F6E9D6; --danger:#B3261E; --danger-soft:#F8E1DF;
  --heat-0:#E3EAF2; --heat-1:#C7E8E3; --heat-2:#86CFC5; --heat-3:#3AA99D; --heat-4:#0F7873;
  --shadow:0 1px 2px rgba(19,35,58,.05),0 6px 18px rgba(19,35,58,.06);
  /* Mode voiture : toujours sombre, quel que soit le thème */
  --night:#0B1220; --night-2:#141E33; --night-3:#22304C; --night-ink:#E9EEF6; --night-muted:#93A1B7; --night-accent:#8FB0F2; --night-amber:#F1B45E;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-ar:"Scheherazade New","Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1423; --surface:#152035; --surface-2:#1B2840; --ink:#E6ECF5; --muted:#9BA9BD; --line:#283753;
  --accent:#8FB0F2; --accent-ink:#0D1423; --accent-soft:#1D2B49;
  --turq:#52C4BA; --turq-soft:#143633; --amber:#F1B45E; --amber-soft:#382A16; --danger:#F2A39D; --danger-soft:#3D1F22;
  --heat-0:#1B2840; --heat-1:#17403C; --heat-2:#1F6B63; --heat-3:#2E9C90; --heat-4:#52C4BA;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1423; --surface:#152035; --surface-2:#1B2840; --ink:#E6ECF5; --muted:#9BA9BD; --line:#283753;
  --accent:#8FB0F2; --accent-ink:#0D1423; --accent-soft:#1D2B49;
  --turq:#52C4BA; --turq-soft:#143633; --amber:#F1B45E; --amber-soft:#382A16; --danger:#F2A39D; --danger-soft:#3D1F22;
  --heat-0:#1B2840; --heat-1:#17403C; --heat-2:#1F6B63; --heat-3:#2E9C90; --heat-4:#52C4BA;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.65rem,6.4vw,2.2rem);line-height:1.12}
h2{font-family:var(--f-display);font-weight:400;font-size:1.22rem;line-height:1.25}
h3{font-size:1rem;font-weight:700;line-height:1.3}

.wrap{max-width:36rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(96px + env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:1.05rem}
.brand svg{width:20px;height:20px;color:var(--amber)}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex:none}
.icon-btn svg{width:22px;height:22px}
.icon-btn:disabled{opacity:.35;cursor:default}
#view{display:flex;flex-direction:column;gap:14px}

.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.meta{font-size:.82rem;color:var(--muted)}
.sub{color:var(--muted);font-size:.95rem}
.small{font-size:.84rem;color:var(--muted)}
.mini{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.hero{display:flex;flex-direction:column;gap:8px;padding-block:4px}
.wk{font-family:var(--f-display);color:var(--accent)}
.wk span{color:var(--muted)}
.streak{display:inline-flex;align-items:center;gap:5px;padding:4px 11px 4px 8px;border-radius:999px;background:var(--amber-soft);color:var(--amber);font-size:.85rem;font-variant-numeric:tabular-nums}
.streak svg{width:15px;height:15px}
.stars{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.stars .s{display:inline-grid;place-items:center;width:15px;height:15px}
.stars .s svg{width:12px;height:12px}
.stars .done{color:var(--turq)}
.stars .now{color:var(--amber)}
.stars .now svg{width:15px;height:15px}
.stars .next{color:var(--line)}

.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.task{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.block-head+.task{border-top:0;padding-top:0}
.task-head{display:flex;gap:12px;align-items:flex-start}
.task-head>svg{width:24px;height:24px;flex:none;color:var(--accent);margin-top:1px}
.task-head p{color:var(--muted);font-size:.92rem}
.done{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--turq-soft);color:var(--turq);font-size:.75rem;font-weight:700;vertical-align:2px}
.done svg{width:12px;height:12px}
.prayers{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.92rem;cursor:pointer;white-space:nowrap}
.chip svg{width:15px;height:15px}
.chip.on{background:var(--turq-soft);border-color:var(--turq);color:var(--turq);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;text-decoration:none;width:100%;text-align:center}
.btn svg{width:18px;height:18px}
.btn-ghost{background:var(--accent-soft);color:var(--accent)}
.btn-quiet{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn-danger{background:var(--danger);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:.88rem;color:var(--muted);padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2)}
.history{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:5px}
.dots .d{width:13px;height:13px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.dots .d.on{background:var(--turq);border-color:var(--turq)}
.dots .d.today{outline:2px solid var(--amber);outline-offset:1px}
.tip{font-size:.95rem;padding:12px 14px;border-radius:var(--r-sm);background:var(--accent-soft)}
.tip strong{color:var(--accent)}
.confirm{font-weight:700}

.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.count{display:flex;flex-direction:column;align-items:center;padding:10px 6px 8px;border-radius:12px;background:var(--surface-2)}
.count b{font-family:var(--f-display);font-weight:400;font-size:1.75rem;line-height:1.1;font-variant-numeric:tabular-nums}
.count small{font-size:.78rem;color:var(--muted)}
.count.new b{color:var(--accent)}
.count.lrn b{color:var(--danger)}
.count.rev b{color:var(--turq)}
.progress{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--turq);border-radius:999px}
.install{display:flex;flex-direction:column;gap:10px}

.fiche{display:flex;flex-direction:column;gap:10px}
.fiche+.fiche{border-top:1px dashed var(--line);padding-top:14px}
.fiche-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fiche-head h3{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.fiche-tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.when{font-size:.85rem;color:var(--muted)}
.btn-sm{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:.85rem;font-weight:700;text-decoration:none;cursor:pointer;flex:none;white-space:nowrap}
.btn-sm svg{width:15px;height:15px}
.btn-sm.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface-2);flex-wrap:wrap}
.seg-b{border:0;background:transparent;padding:0 14px;min-height:34px;border-radius:999px;font-size:.85rem;color:var(--muted);cursor:pointer}
.seg-b.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.line{display:flex;flex-direction:column;gap:4px;padding-block:12px;border-bottom:1px solid var(--line);min-width:0}
.line:first-child{padding-top:2px}
.line:last-child{border-bottom:0}
.line-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pos{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--turq)}
.cs{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.cs-new{background:var(--accent-soft);color:var(--accent)}
.cs-lrn{background:var(--danger-soft);color:var(--danger)}
.cs-rev{background:var(--turq-soft);color:var(--turq)}
.cs-off{background:var(--surface-2);color:var(--muted)}
.ar{font-family:var(--f-ar);font-size:1.75rem;line-height:1.95;text-align:right;overflow-wrap:break-word}
.vn{display:inline-grid;place-items:center;min-width:1.55em;height:1.55em;padding:0 .2em;border:1px solid var(--line);border-radius:999px;font-size:.6em;line-height:1;color:var(--muted);vertical-align:.3em}
.ph{font-style:italic;color:var(--muted);font-size:.95rem}
.resp{font-size:.93rem;color:var(--turq);font-style:italic}
.resp span{display:block;font-style:normal;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.steps{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.note{font-size:.9rem;color:var(--muted)}
.why{font-size:.92rem;padding:10px 12px;border-radius:var(--r-sm);background:var(--amber-soft)}
.why span{display:block;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}
.src{font-size:.78rem;color:var(--muted)}
.wbw{display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.wb{display:flex;flex-direction:column;align-items:center;padding:5px 8px 6px;border-radius:10px;background:var(--surface-2);min-width:3.4rem;max-width:9rem;text-align:center}
.wb b{font-family:var(--f-ar);font-weight:400;font-size:1.3rem;line-height:1.6}
.wb i{font-size:.72rem;color:var(--muted)}
.wb small{font-size:.78rem;line-height:1.25}

.rules{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.rules li{display:flex;gap:10px;font-size:.95rem}
.rules svg{width:13px;height:13px;flex:none;color:var(--amber);margin-top:5px}
.weeks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.week{display:grid;grid-template-columns:2.6rem 1fr auto;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.weeks li:last-child .week{border-bottom:0}
.wn{font-family:var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.week.done .wn{color:var(--turq)}
.week.now .wn{color:var(--amber)}
.wt{min-width:0}
.week.now .wt{font-weight:700}
.tag{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag:empty{display:none}
.tag.now{background:var(--amber-soft);color:var(--amber)}
.tag.done{background:var(--turq-soft);color:var(--turq)}

.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters .chip{flex:none}
.filters .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row-card{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:58px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.rows li:last-child .row-card{border-bottom:0}
.rc-main{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.rc-main small{color:var(--muted);font-size:.84rem}

.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.stack.sm{height:6px}
.stack i{display:block;height:100%}
.stack .m{background:var(--turq)}
.stack .y{background:var(--heat-2)}
.stack .l{background:var(--danger)}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{display:inline-block;width:10px;height:10px;border-radius:3px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{display:flex;flex-direction:column;padding:10px;border-radius:12px;background:var(--surface-2)}
.kpi b{font-family:var(--f-display);font-weight:400;font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi small{font-size:.76rem;color:var(--muted)}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;width:max-content}
.heat span{border-radius:3px;background:var(--heat-0)}
.heat .h1{background:var(--heat-1)}
.heat .h2{background:var(--heat-2)}
.heat .h3{background:var(--heat-3)}
.heat .h4{background:var(--heat-4)}
.heat .hx{background:transparent}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.fc div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:118px}
.fc i{display:block;width:70%;max-width:30px;border-radius:6px 6px 2px 2px;background:var(--accent)}
.fc i.zero{background:var(--line)}
.fc b{font-size:.8rem;font-variant-numeric:tabular-nums}
.fc small{font-size:.72rem;color:var(--muted)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:12px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.set-row small{color:var(--muted);font-size:.84rem}
.set-col{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-bottom:1px solid var(--line)}
.set-col>span{display:flex;flex-direction:column;gap:2px}
.set-col small{color:var(--muted);font-size:.84rem}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;line-height:1;cursor:pointer}
.stepper b{min-width:2.2rem;text-align:center;font-variant-numeric:tabular-nums;font-size:1.1rem}
.mg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mg-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mg-row:last-child{border-bottom:0}
.mg-row>span:first-child{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.mg-row small{color:var(--muted)}
.mg-act{display:flex;gap:6px}

.lists{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.list-btn{display:flex;gap:14px;align-items:flex-start;width:100%;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.list-btn>svg{width:20px;height:20px;flex:none;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:7px;box-sizing:content-box}
.list-btn span{display:flex;flex-direction:column;gap:2px;min-width:0}
.list-btn small{color:var(--muted);font-size:.88rem}
.list-btn:disabled{opacity:.55;cursor:default}
.warn{padding:12px 14px;border-radius:var(--r-sm);background:var(--amber-soft);font-size:.92rem}

.set-list{display:flex;flex-direction:column}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:12px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.toggle:last-child{border-bottom:0}
.toggle>span{display:flex;flex-direction:column;gap:2px;min-width:0}
.toggle small{color:var(--muted);font-size:.84rem}
.toggle input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.toggle i{flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);transition:transform .2s}
.toggle input:checked+i{background:var(--turq)}
.toggle input:checked+i::after{transform:translateX(18px)}
.toggle input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.toggle input:disabled+i{opacity:.4}
.danger p{margin-bottom:10px;font-weight:700}

.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.letter{display:flex;flex-direction:column;align-items:center;padding:6px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.letter .lg{font-family:var(--f-ar);font-size:2rem;line-height:1.5}
.letter .ln{font-size:.72rem;color:var(--muted)}
.letter.hard{border-color:var(--amber);background:var(--amber-soft)}
.key-hard{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--amber-soft);border:1px solid var(--amber);vertical-align:-1px;margin-right:5px}
.wk-letters{display:flex;flex-direction:column;gap:8px}
.wl{display:flex;gap:14px;align-items:center;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:left;cursor:pointer}
.wl .lg{font-family:var(--f-ar);font-size:2.6rem;line-height:1.3;min-width:3rem;text-align:center;color:var(--accent)}
.wl>span:last-child{display:flex;flex-direction:column;gap:1px;min-width:0}
.wl small{color:var(--muted);font-size:.84rem}
.ar-s{font-family:var(--f-ar);font-size:1.35rem;line-height:1.7}
.letter-hero{display:flex;gap:18px;align-items:center}
.letter-hero>span{font-family:var(--f-ar);font-size:5rem;line-height:1.25;color:var(--accent);min-width:5.5rem;text-align:center}
.letter-hero div{display:flex;flex-direction:column;gap:4px}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:8px}
.forms div{display:flex;flex-direction:column;align-items:center;padding:8px;border-radius:12px;background:var(--surface-2)}
.forms span{font-family:var(--f-ar);font-size:2.2rem;line-height:1.5}
.forms small{font-size:.72rem;color:var(--muted)}
.ex{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.signs{display:flex;flex-direction:column}
.sign{display:grid;grid-template-columns:6rem 1fr;gap:12px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.sign:last-child{border-bottom:0}
.sg{font-family:var(--f-ar);font-size:1.8rem;line-height:1.6;text-align:center}
.sign em{color:var(--muted)}
.sign p{font-size:.9rem;color:var(--muted)}
.legend{margin:0;display:flex;flex-direction:column}
.legend div{display:grid;grid-template-columns:5.5rem 1fr;gap:12px;padding-block:7px;border-bottom:1px solid var(--line)}
.legend div:last-child{border-bottom:0}
.legend dt{font-weight:700;font-style:italic}
.legend dd{margin:0;color:var(--muted);font-size:.92rem}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:36rem;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;padding:8px 2px;border:0;background:transparent;color:var(--muted);font-size:.7rem;cursor:pointer;min-width:0}
.tab svg{width:23px;height:23px}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}

.sheet{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-head-in{max-width:36rem;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{min-width:0}
.sheet-body{max-width:36rem;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(32px + env(safe-area-inset-bottom,0px))}
.sheet-h{font-size:1.4rem}

.study{position:fixed;inset:0;z-index:42;background:var(--bg);display:flex;flex-direction:column}
.study-head{display:flex;align-items:center;gap:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.mini-counts{flex:1;display:flex;justify-content:center;gap:18px;font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem}
.mc{padding-bottom:1px;border-bottom:2px solid transparent}
.mc.new{color:var(--accent)}
.mc.lrn{color:var(--danger)}
.mc.rev{color:var(--turq)}
.mc.cur{border-bottom-color:currentColor}
.study-body{flex:1;min-height:0;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.study-card{max-width:36rem;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:20px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.sc-ctx{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.study-card .ar{font-size:2.05rem;text-align:center}
.study-card .ph,.study-card .resp{text-align:center}
.sc-ask{text-align:center;color:var(--muted);padding-block:6px}
.sc-sep{border:0;border-top:1px dashed var(--line);margin:4px 0;width:100%}
.sc-fr{text-align:center;font-size:1.15rem;font-weight:700;line-height:1.45}
.study-card .wbw{justify-content:center}
.sc-tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.study-foot{border-top:1px solid var(--line);background:var(--bg);padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.study-foot-in{max-width:36rem;margin:0 auto}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:62px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.9rem;padding:0 2px}
.grade small{font-weight:400;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.again{color:var(--danger)}
.hard{color:var(--amber)}
.good{color:var(--turq)}
.easy{color:var(--accent)}
.help-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.help-list b{display:inline-block;min-width:6.2rem}
.study-done{text-align:center;align-items:center}
.study-done svg{width:44px;height:44px;color:var(--amber)}
.study-done h2{font-size:1.6rem}

.car{position:fixed;inset:0;z-index:50;background:var(--night);color:var(--night-ink);display:flex;flex-direction:column;gap:16px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.car-top{display:flex;align-items:center;gap:12px;max-width:40rem;width:100%;margin:0 auto}
.car-top>div{flex:1;min-width:0}
.car-eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--night-muted);font-weight:700}
.car-title{font-family:var(--f-display);font-size:1.2rem}
.car-count{font-variant-numeric:tabular-nums;color:var(--night-muted)}
.car-x{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;border:1px solid var(--night-3);background:var(--night-2);color:var(--night-ink);cursor:pointer;flex:none}
.car-x svg{width:22px;height:22px}
.car-main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;max-width:40rem;width:100%;margin:0 auto}
.car-card{font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--night-amber);font-weight:700}
.car-ar{font-family:var(--f-ar);font-size:clamp(1.8rem,7vw,2.8rem);line-height:1.9}
.car-fr{font-size:clamp(1rem,4vw,1.25rem);color:var(--night-muted)}
.car-warn{max-width:40rem;margin:0 auto;padding:10px 12px;border-radius:12px;background:var(--night-2);color:var(--night-amber);text-align:center}
.car-wait{max-width:40rem;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.car-label{text-align:center;font-weight:700;color:var(--night-accent);min-height:1.5em}
.car-track{height:6px;border-radius:999px;background:var(--night-3);overflow:hidden}
.car-track i{display:block;height:100%;width:0;background:var(--night-accent);border-radius:999px}
.car-ctrl{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:12px;max-width:40rem;width:100%;margin:0 auto}
.car-ctrl button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:72px;border-radius:20px;border:1px solid var(--night-3);background:var(--night-2);color:var(--night-ink);font-size:1.05rem;font-weight:700;cursor:pointer}
.car-ctrl svg{width:30px;height:30px}
.car-ctrl .car-play{background:var(--night-accent);border-color:var(--night-accent);color:var(--night)}
.car-safe{text-align:center;font-size:.82rem;color:var(--night-muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px;padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:.92rem;box-shadow:var(--shadow)}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}
@media (prefers-reduced-motion: reduce){.toggle i,.toggle i::after{transition:none}}
</style>

<body>

<div class="wrap">
  <header class="topbar">
    <div class="brand" id="brand"></div>
    <button class="icon-btn" id="btn-settings" data-act="settings" aria-label="Réglages"></button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="tabs-in" id="tabs"></div></nav>

<div id="study" class="layer study" hidden role="dialog" aria-modal="true" aria-label="Mes cartes">
  <div class="study-head">
    <button class="icon-btn js-close" data-act="study-close" aria-label="Fermer les cartes"></button>
    <div class="mini-counts" id="study-counts" aria-label="Nouvelles, en cours, à revoir"></div>
    <button class="icon-btn" id="study-undo" data-act="undo" aria-label="Annuler la dernière réponse"></button>
  </div>
  <div class="study-body"><div id="study-card"></div></div>
  <div class="study-foot"><div class="study-foot-in" id="study-foot"></div></div>
</div>

<div id="detail" class="layer sheet" hidden role="dialog" aria-modal="true" aria-labelledby="detail-title">
  <div class="sheet-head"><div class="sheet-head-in"><h2 id="detail-title"></h2><button class="icon-btn js-close" data-act="close" data-layer="detail" aria-label="Fermer"></button></div></div>
  <div class="sheet-body" id="detail-body"></div>
</div>

<div id="car" class="layer car" hidden role="dialog" aria-modal="true" aria-labelledby="car-title">
  <div class="car-top">
    <div><p class="car-eyebrow">Mode voiture</p><p id="car-title" class="car-title"></p></div>
    <span id="car-count" class="car-count"></span>
    <button class="car-x js-close" data-act="car-close" aria-label="Fermer le mode voiture"></button>
  </div>
  <div class="car-main">
    <p id="car-card" class="car-card"></p>
    <p id="car-ar" class="car-ar" lang="ar" dir="rtl"></p>
    <p id="car-fr" class="car-fr"></p>
  </div>
  <p id="car-noaudio" class="car-warn" hidden>La lecture audio n’est pas disponible dans cette fenêtre. Ouvre la page dans Safari ou Chrome.</p>
  <div class="car-wait"><p id="car-label" class="car-label"></p><div class="car-track"><i id="car-bar"></i></div></div>
  <div class="car-ctrl">
    <button id="car-prev" data-act="car-prev" aria-label="Phrase précédente"></button>
    <button id="car-toggle" class="car-play" data-act="car-toggle"></button>
    <button id="car-next" data-act="car-next" aria-label="Phrase suivante"></button>
  </div>
  <p class="car-safe">Les yeux sur la route : tout se fait à l’oreille.</p>
</div>

<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

  const ld = q.learnDue.filter(other);
  if (ld.length) return ld[0];
  const rv = q.review.filter(other), fr = q.fresh.filter(other);
  if (fr.length && (session.count % 4 === 3 || !rv.length)) return fr[0];
  if (rv.length) return rv[0];
  if (fr.length) return fr[0];
  const ahead = q.learn.filter(id => state.cards[id].due <= now + LEARN_AHEAD);
  return ahead.filter(other)[0] || ahead[0] || null;
}
function openStudy() {
  session.count = 0; session.undo = null;
  openLayer("study");
  showCard(pickNext());
}
function showCard(id) {
  clearTimeout(session.timer);
  session.current = id; session.shown = false; session.shownAt = Date.now();
  renderStudy();
  const body = $(".study-body"); if (body) body.scrollTop = 0;
  if (!id) {
    const q = queues(), soon = q.learn.length ? Math.min(...q.learn.map(x => state.cards[x].due)) : 0;
    if (soon) session.timer = setTimeout(() => { if (!$("#study").hidden && !session.current) showCard(pickNext()); }, Math.max(1000, soon - Date.now() - LEARN_AHEAD + 1000));
  }
}
function answer(g) {
  const id = session.current;
  if (!id || !session.shown) return;
  const now = Date.now(), prev = state.cards[id], k = todayKey(), before = dayRec(k);
  session.undo = { id, prev: prev ? { ...prev } : null, day: { ...before, p: before.p.slice() }, count: session.count };
  state.cards[id] = schedule(prev, g, now, true);
  const r = dayRec(k);
  r.a = (r.a || 0) + 1;
  if (g > 1) r.ok = (r.ok || 0) + 1;
  if (!prev) r.n = (r.n || 0) + 1;
  if (prev && prev.s === "review") { r.rv = (r.rv || 0) + 1; if (g > 1) r.rvok = (r.rvok || 0) + 1; }
  r.ms = (r.ms || 0) + clamp(now - session.shownAt, 0, 60000);
  state.days[k] = r;
  session.count++;
  commit(false);
  showCard(pickNext(id));
}
function undoAnswer() {
  const u = session.undo;
  if (!u) return;
  if (u.prev) state.cards[u.id] = u.prev; else delete state.cards[u.id];
  state.days[todayKey()] = u.day;
  session.count = u.count; session.undo = null;
  commit(false);
  showCard(u.id);
}

function nextDueText() {
  let best = Infinity, count = 0;
  const tomorrow = dayStart(1);
  for (const [id, s] of Object.entries(state.cards)) {
    if (!isObj(s) || s.susp || !isLive(id) || s.s !== "review") continue;
    if (s.due < best) best = s.due;
    if (s.due <= tomorrow) count++;
  }
  if (best === Infinity) return "Les cartes arrivent au fil des semaines du programme.";
  const d = Math.round((best - dayStart(0)) / 864e5);
  if (d <= 0) return "Des cartes t’attendent déjà.";
  if (d === 1) return `Demain : ${plural(count, "carte", "cartes")} à revoir.`;
  return `Prochaines cartes dans ${d} jours.`;
}

/* ---------- Voix ---------- */
const tts = { ok: "speechSynthesis" in window && typeof window.SpeechSynthesisUtterance === "function", fr: null, ar: null };
const normLang = v => String(v.lang || "").toLowerCase().replace("_", "-");
function pickVoice(list, lang, prefer) {
  const c = list.filter(v => normLang(v).startsWith(lang));
  return c.find(v => prefer.includes(normLang(v)) && v.localService) || c.find(v => prefer.includes(normLang(v))) || c.find(v => v.localService) || c[0] || null;
}
function loadVoices() {
  if (!tts.ok) return;
  let list = [];
  try { list = speechSynthesis.getVoices() || []; } catch (e) { list = []; }
  const fr = pickVoice(list, "fr", ["fr-fr"]), ar = pickVoice(list, "ar", ["ar-sa", "ar-xa", "ar-eg"]);
  const changed = (fr && fr.name) !== (tts.fr && tts.fr.name) || (ar && ar.name) !== (tts.ar && tts.ar.name);
  tts.fr = fr; tts.ar = ar;
  if (changed) { refresh(); renderStudy(); }
}
const canAr = () => tts.ok && !!tts.ar && state.set.arVoice;
const letterCount = s => String(s || "").replace(/[ً-ٰٟۖ-ۭـ\s،؛.,:;!?«»()\-]/g, "").length;
const reciteMs = (ar, times = 1) => Math.round(Math.max(1800, letterCount(ar) * 165 + 1100) * times * (state.set.longPause ? 1.5 : 1));
const speakable = t => String(t).replace(/\s*ﷺ/g, "").replace(/×\s?(\d+)/g, "$1 fois");
function voiceStatus() {
  if (!tts.ok) return "La lecture audio n’est pas disponible dans cette fenêtre. Ouvre la page dans Safari ou Chrome.";
  return `Voix française : ${tts.fr ? tts.fr.name : "voix par défaut"}. Voix arabe : ${tts.ar ? tts.ar.name : "aucune sur cet appareil ; tu peux en installer une dans les réglages de synthèse vocale du téléphone (rubrique Accessibilité)"}.`;
}

/* ---------- Lecteur du mode voiture ---------- */
const player = { list: "semaine", steps: [], i: 0, token: 0, playing: false, finished: false, wake: null, endSpeak: null, endWait: null };
function speak(text, lang, rate) {
  return new Promise(resolve => {
    if (!tts.ok || !text) { resolve(); return; }
    let done = false, guard = 0;
    const finish = () => { if (done) return; done = true; clearTimeout(guard); if (player.endSpeak === finish) player.endSpeak = null; resolve(); };
    const u = new SpeechSynthesisUtterance(text);
    const v = lang === "ar" ? tts.ar : tts.fr;
    u.lang = v ? v.lang : (lang === "ar" ? "ar-SA" : "fr-FR");
    if (v) u.voice = v;
    u.rate = rate || (state.set.slow ? 0.85 : 1);
    const units = lang === "ar" ? letterCount(text) * 2.2 : text.length;
    guard = setTimeout(finish, 4000 + units * 110 / u.rate);
    u.onend = finish; u.onerror = finish;
    player.endSpeak = finish;
    try { speechSynthesis.speak(u); } catch (e) { finish(); }
  });
}
function hush() {
  try { if (tts.ok) speechSynthesis.cancel(); } catch (e) { /* rien à arrêter */ }
  if (player.endSpeak) player.endSpeak();
  if (player.endWait) player.endWait();
}
function primeSpeech() {
  if (!tts.ok) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* ignoré */ }
}
function wait(ms, label) {
  return new Promise(resolve => {
    showWait(ms, label);
    let t = 0;
    const done = () => { clearTimeout(t); if (player.endWait === done) player.endWait = null; hideWait(); resolve(); };
    t = setTimeout(done, ms);
    player.endWait = done;
  });
}
async function requestWake() {
  try {
    if (navigator.wakeLock && !player.wake) {
      player.wake = await navigator.wakeLock.request("screen");
      player.wake.addEventListener("release", () => { player.wake = null; });
    }
  } catch (e) { player.wake = null; }
}
function releaseWake() { try { if (player.wake) player.wake.release(); } catch (e) { /* déjà libéré */ } player.wake = null; }

function carSteps(list) {
  const steps = [];
  if (list === "semaine") {
    const pass = [];
    WEEKS[state.week - 1].cards.forEach(id => {
      const c = CARD[id];
      pass.push({ kind: "title", card: c });
      linesOf(c).forEach(l => pass.push({ kind: c.known || l.quranic ? "recite" : "learn", card: c, line: l }));
    });
    if (pass.length) {
      steps.push({ kind: "say", text: "Ma semaine. Garde les yeux sur la route." });
      steps.push(...pass, { kind: "say", text: "Deuxième passage." }, ...pass);
    }
  } else if (list === "revision") {
    // Les cartes déjà vues qui reviennent le plus tôt, puis le reste du programme passé
    let picks = Object.entries(state.cards)
      .filter(([id, s]) => id.endsWith(":f") && isObj(s) && !s.susp && isLive(id))
      .sort((a, b) => a[1].due - b[1].due).slice(0, 14)
      .map(([id]) => { const { fid, i } = parseCid(id); return { c: CARD[fid], l: linesOf(CARD[fid])[i] }; });
    if (!picks.length) picks = shuffle(cardsUpTo(state.week - 1).flatMap(c => linesOf(c).map(l => ({ c, l })))).slice(0, 14);
    if (picks.length) {
      steps.push({ kind: "say", text: "Révision. Récite, puis écoute le sens." });
      shuffle(picks).forEach(({ c, l }) => steps.push({ kind: "recite", card: c, line: l, withTitle: true }));
    }
  } else if (ADHKAR[list]) {
    steps.push({ kind: "say", text: ADHKAR[list].title + "." });
    ADHKAR[list].items.forEach(it => {
      const c = CARD[it.card];
      steps.push({ kind: "dhikr", card: c, x: it.x || 1, lines: linesOf(c, list === "soir"), ready: learned(c) });
    });
  }
  return steps;
}
function cue(c, l) {
  if (l.pos) return speakable(l.pos);
  if (l.verse) return "Verset " + l.verse;
  return c.lines.length > 1 ? "Phrase " + l.n : speakable(c.title);
}
function actionsOf(step) {
  const A = [], c = step.card, l = step.line, arRate = state.set.slow ? 0.7 : 0.85;
  if (step.kind === "say") { A.push({ say: "fr", text: step.text }, { wait: 400 }); return A; }
  if (step.kind === "title") { A.push({ say: "fr", text: speakable(c.title) + "." }, { wait: 400 }); return A; }
  if (step.kind === "recite") {
    A.push({ say: "fr", text: (step.withTitle ? speakable(c.title) + ". " : "") + cue(c, l) + ". Récite." });
    A.push({ wait: reciteMs(l.ar, Math.min(l.x || 1, 3)), label: "À toi : récite" });
    A.push({ say: "fr", text: "Sens : " + speakable(l.fr) });
    if (l.resp) A.push({ say: "fr", text: "Et Allah répond : " + speakable(l.resp) });
    A.push({ wait: 700 });
    return A;
  }
  if (step.kind === "learn") {
    if (canAr()) {
      A.push({ say: "fr", text: cue(c, l) + ". Écoute." }, { say: "ar", text: l.ar, rate: arRate }, { say: "fr", text: "Répète." });
      A.push({ wait: reciteMs(l.ar), label: "À toi : répète" }, { say: "ar", text: l.ar, rate: arRate }, { wait: reciteMs(l.ar), label: "Encore une fois" });
      A.push({ say: "fr", text: "Sens : " + speakable(l.fr) });
    } else {
      A.push({ say: "fr", text: cue(c, l) + ". Sens : " + speakable(l.fr) }, { say: "fr", text: "Dis-la en arabe." }, { wait: reciteMs(l.ar), label: "À toi" });
    }
    A.push({ wait: 700 });
    return A;
  }
  const x = step.x, all = step.lines.map(z => z.ar).join(" ");
  const times = x === 1 ? "" : x === 3 ? " Trois fois." : x === 100 ? " Cent fois." : " " + x + " fois.";
  if (step.ready) {
    A.push({ say: "fr", text: speakable(c.title) + "." + times + " Récite." });
    if (x >= 10) {
      const per = reciteMs(all) * 0.55, chunk = Math.round(x / 4);
      for (let k = 1; k <= 4; k++) {
        const upto = k === 4 ? x : k * chunk;
        A.push({ wait: per * chunk, label: upto + " sur " + x }, { say: "fr", text: k === 4 ? x + ". C’est fait." : String(upto) });
      }
    } else A.push({ wait: reciteMs(all, x), label: "À toi : récite" });
  } else if (canAr() && !step.lines.some(z => z.quranic)) {
    A.push({ say: "fr", text: speakable(c.title) + "." + times + " Répète après moi." });
    for (let r = 0; r < Math.min(x, 3); r++) step.lines.forEach(z => { A.push({ say: "ar", text: z.ar, rate: arRate }, { wait: reciteMs(z.ar), label: "Répète" }); });
  } else {
    A.push({ say: "fr", text: speakable(c.title) + " : pas encore apprise, on passe." });
  }
  A.push({ wait: 900 });
  return A;
}
async function play() {
  const my = ++player.token;
  player.playing = true; player.finished = false;
  renderCar();
  requestWake();
  while (player.i < player.steps.length) {
    showStep(player.steps[player.i]);
    for (const a of actionsOf(player.steps[player.i])) {
      if (my !== player.token) return;
      if (a.say) await speak(a.text, a.say, a.rate);
      else await wait(a.wait, a.label);
    }
    if (my !== player.token) return;
    player.i++;
  }
  if (my !== player.token) return;
  player.playing = false; player.finished = true; player.i = Math.max(0, player.steps.length - 1);
  renderCar();
  patchToday({ car: 1 });
  await speak("C’est terminé. Bonne route.", "fr");
  releaseWake();
}
function stopPlay() { player.token++; player.playing = false; hush(); renderCar(); }
function startCar(list) {
  let steps = carSteps(list);
  if (!steps.length) { list = "revision"; steps = carSteps(list); }
  if (!steps.length) { list = "matin"; steps = carSteps(list); }
  player.list = list; player.steps = steps; player.i = 0; player.finished = false;
  openLayer("car");
  if (tts.ok) { primeSpeech(); play(); } else renderCar();
}
function stepCar(d) {
  const was = player.playing;
  stopPlay();
  player.finished = false;
  player.i = clamp(player.i + d, 0, player.steps.length - 1);
  if (was) play(); else renderCar();
}
function closeCar() { stopPlay(); releaseWake(); closeLayer("car"); }
function renderCar() {
  if ($("#car").hidden) return;
  $("#car-title").textContent = player.list === "semaine" ? "Ma semaine" : player.list === "revision" ? "Révision" : ADHKAR[player.list].title;
  $("#car-noaudio").hidden = tts.ok;
  const btn = $("#car-toggle");
  btn.innerHTML = player.playing ? ICON.pause + "<span>Pause</span>" : ICON.play + "<span>" + (player.finished ? "Rejouer" : "Lecture") + "</span>";
  btn.setAttribute("aria-label", player.playing ? "Mettre en pause" : "Lancer la lecture");
  btn.disabled = !tts.ok;
  if (player.finished) {
    $("#car-count").textContent = "";
    $("#car-card").textContent = "Terminé";
    $("#car-ar").textContent = "";
    $("#car-fr").textContent = "Séance comptée pour aujourd’hui. Bonne route.";
  } else if (player.steps[player.i]) showStep(player.steps[player.i]);
}
function showStep(step) {
  const c = step.card;
  $("#car-count").textContent = (player.i + 1) + " / " + player.steps.length;
  if (step.kind === "say") { $("#car-card").textContent = ""; $("#car-ar").textContent = ""; $("#car-fr").textContent = step.text; return; }
  $("#car-card").textContent = c.title + (step.x > 1 ? " · ×" + step.x : "");
  $("#car-ar").textContent = step.line ? step.line.ar : step.lines ? step.lines.map(z => z.ar).join(" ") : "";
  $("#car-fr").textContent = step.line ? step.line.fr : step.kind === "title" ? c.when : step.lines.map(z => z.fr).join(" ");
}
function showWait(ms, label) {
  const bar = $("#car-bar");
  $("#car-label").textContent = label || "";
  bar.style.transition = "none"; bar.style.width = "0%";
  void bar.offsetWidth;
  bar.style.transition = `width ${Math.round(ms)}ms linear`; bar.style.width = "100%";
}
function hideWait() { const bar = $("#car-bar"); bar.style.transition = "none"; bar.style.width = "0%"; $("#car-label").textContent = ""; }

/* ---------- Écoute d’une fiche ---------- */
let listening = null, listenTok = 0;
async function listenCard(id, eve) {
  if (listening === id) { listening = null; listenTok++; hush(); refresh(); return; }
  const my = ++listenTok;
  hush(); listening = id; refresh();
  for (const l of linesOf(CARD[id], eve)) {
    if (my !== listenTok) return;
    await speak(l.ar, "ar", state.set.slow ? 0.7 : 0.85);
    if (my !== listenTok) return;
    await new Promise(r => setTimeout(r, 450));
  }
  if (my === listenTok) { listening = null; refresh(); }
}

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function installHelp() {
  if (installEvt) return `<button class="btn" data-act="install">Installer l’appli</button>`;
  return `<p class="small">${isIOS ? "Dans Safari : bouton Partager, puis « Sur l’écran d’accueil »." : "Dans le menu ⋮ du navigateur : « Installer l’application » ou « Ajouter à l’écran d’accueil »."}</p>`;
}
function exportData() {
  const data = JSON.stringify({ app: "priere-mot-a-mot", exportedAt: new Date().toISOString(), state }, null, 1);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
  a.download = `priere-sauvegarde-${todayKey()}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  state.lastExport = Date.now();
  commit(false);
  if (ui.detail) renderDetail();
  toast("Sauvegarde téléchargée. Garde ce fichier en lieu sûr.");
}
function importData(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(String(fr.result));
      const s = isObj(j) && isObj(j.state) ? j.state : j;
      if (!isObj(s) || !("week" in s)) throw new Error("format");
      state = normalize(s);
      commit(false);
      refresh();
      toast("Sauvegarde restaurée.");
    } catch (e) { toast("Ce fichier n’est pas une sauvegarde de l’appli."); }
  };
  fr.readAsText(file);
}
function lastExportText() {
  if (!state.lastExport) return "Aucune sauvegarde pour l’instant.";
  const d = Math.floor((Date.now() - state.lastExport) / 864e5);
  return d < 1 ? "Dernière sauvegarde : aujourd’hui." : `Dernière sauvegarde : il y a ${plural(d, "jour", "jours")}.`;
}

function historyRow() {
  const t = todayKey();
  let dots = "";
  for (let i = 13; i >= 0; i--) {
    const k = addDays(t, -i);
    dots += `<span class="d${active(state.days[k]) ? " on" : ""}${i === 0 ? " today" : ""}" title="${dateOf(k).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric" })}"></span>`;
  }
  return `<div class="history"><span class="meta">Tes 14 derniers jours</span><div class="dots" aria-hidden="true">${dots}</div></div>`;
}
function countTiles(q) {
  return `<div class="counts">

}
function lineItem(l, c, o) {

  return `<li class="line">
    ${meta || st ? `<div class="line-top">${meta ? `<p class="pos">${esc(meta)}</p>` : "<span></span>"}${st ? `<span class="cs ${st[1]}">${esc(st[0])}</span>` : ""}</div>` : ""}
    <p class="ar" lang="ar" dir="rtl">${esc(l.ar)}${l.verse ? ` <span class="vn">${arNum(l.verse)}</span>` : ""}</p>
    <p class="ph"${state.set.hidePh ? " hidden" : ""}>${esc(l.ph)}</p>
    <p class="fr">${esc(l.fr)}</p>
    ${l.resp ? `<p class="resp"><span>Allah répond</span>« ${esc(l.resp)} »</p>` : ""}
    ${o.words ? wbwHtml(l) : ""}
  </li>`;
}
function cardBlock(c) {
  const eve = !!ui.eve[c.id];
  const hasWords = c.lines.some((l, i) => WBW[c.id + ":" + i]);
  const showWords = hasWords && !!ui.wbw[c.id] && !eve;
  const tracked = !eve && (unlockedFiches().includes(c.id) || cardsOfFiche(c).some(id => state.cards[id]));
  let listen = "";
  if (c.quran) listen = `<a class="btn-sm" href="${esc(c.quran)}" target="_blank" rel="noopener">${ICON.ext}Récitant</a>`;
  else if (tts.ok && tts.ar) listen = `<button class="btn-sm" data-act="listen" data-id="${c.id}">${listening === c.id ? ICON.stop + "Arrêter" : ICON.sound + "Écouter"}</button>`;
  const words = hasWords ? `<button class="btn-sm${showWords ? " on" : ""}" data-act="words" data-id="${c.id}" aria-pressed="${showWords}">${ICON.words}Mot à mot</button>` : "";
  const seg = c.eveLines ? `<div class="seg" role="group" aria-label="Version"><button class="seg-b${eve ? "" : " on"}" data-act="eve" data-id="${c.id}" data-v="0" aria-pressed="${!eve}">Matin</button><button class="seg-b${eve ? " on" : ""}" data-act="eve" data-id="${c.id}" data-v="1" aria-pressed="${eve}">Soir</button></div>` : "";
  return `<article class="fiche">

    ${c.why ? `<p class="why"><span>Pourquoi</span>${esc(c.why)}</p>` : ""}

  </article>`;
}

function toggle(key, label, help, ctx, disabled) {

function viewCartes() {
  const s = deckStats(), q = queues(), ret = (() => { let rv = 0, ok = 0; for (let i = 0; i < 30; i++) { const r = state.days[addDays(todayKey(), -i)]; if (isObj(r)) { rv += r.rv || 0; ok += r.rvok || 0; } } return rv ? Math.round(ok / rv * 100) + " %" : "—"; })();
  const totalAnswers = Object.values(state.days).reduce((t, r) => t + (isObj(r) ? (r.a || 0) : 0), 0);
  const totalMin = Math.round(Object.values(state.days).reduce((t, r) => t + (isObj(r) ? (r.ms || 0) : 0), 0) / 60000);
  // Calendrier : 16 semaines, une colonne par semaine, du lundi au dimanche
  const today = dateOf(todayKey()), dow = (today.getDay() + 6) % 7;
  const start = new Date(today); start.setDate(start.getDate() - dow - 7 * 15);
  let cells = "";
  for (let i = 0; i < 16 * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (d > today) { cells += `<span class="hx"></span>`; continue; }
    const r = state.days[keyOf(d)], a = isObj(r) ? (r.a || 0) : 0;
    const lvl = a === 0 ? (active(r) ? 1 : 0) : a < 10 ? 1 : a < 25 ? 2 : a < 50 ? 3 : 4;
    cells += `<span class="h${lvl}" title="${d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" })} : ${plural(a, "réponse", "réponses")}"></span>`;
  }
  // Prévision des 7 prochains jours
  const fc = [0, 0, 0, 0, 0, 0, 0], base = dayStart(0);
  for (const [id, c] of Object.entries(state.cards)) {
    if (!isObj(c) || c.susp || !isLive(id)) continue;
    if (c.s !== "review") { fc[0]++; continue; }
    const d = Math.max(0, Math.floor((c.due - base) / 864e5));
    if (d < 7) fc[d]++;
  }
  const max = Math.max(1, ...fc);
  const dayName = d => d === 0 ? "auj." : d === 1 ? "dem." : new Date(base + d * 864e5).toLocaleDateString("fr-FR", { weekday: "short" });
  const fiches = unlockedFiches();
  Object.keys(state.cards).forEach(id => { const { fid } = parseCid(id); if (CARD[fid] && !fiches.includes(fid)) fiches.push(fid); });
  const reverseOpts = [["never", "Jamais"], ["learn", "Invocations"], ["always", "Toujours"]];
  return `
  <section class="hero">
    <p class="eyebrow">Mes cartes</p>
    <h1>${plural(s.mature + s.young, "carte retenue", "cartes retenues")}</h1>
    <p class="sub">Une carte est retenue quand tu l’as trouvée et qu’elle revient dans un jour ou plus. Elle devient mûre quand elle revient dans trois semaines ou plus.</p>
  </section>
  <section class="block">
    <div class="block-head"><h2>Aujourd’hui</h2></div>
    ${countTiles(q)}
    <button class="btn" data-act="study">${ICON.cards}${q.fresh.length + q.learn.length + q.review.length ? "Réviser mes cartes" : "Ouvrir mes cartes"}</button>
  </section>
  <section class="block">
    <div class="block-head"><h2>Où tu en es</h2><span class="meta">${plural(s.total, "carte", "cartes")}</span></div>
    ${stackBar([[s.mature, "m"], [s.young, "y"], [s.lrn, "l"]], s.total)}
    <div class="legend-row">
      <span><i style="background:var(--turq)"></i>${s.mature} mûres</span>
      <span><i style="background:var(--heat-2)"></i>${s.young} retenues</span>
      <span><i style="background:var(--danger)"></i>${s.lrn} en cours</span>
      <span><i style="background:var(--surface-2);outline:1px solid var(--line)"></i>${s.nw} à découvrir</span>
    </div>
    <div class="kpis">
      <div class="kpi"><b>${ret}</b><small>trouvées (30 j)</small></div>
      <div class="kpi"><b>${totalAnswers}</b><small>réponses en tout</small></div>
      <div class="kpi"><b>${totalMin} min</b><small>passées en tout</small></div>
    </div>
  </section>
  <section class="block">
    <div class="block-head"><h2>Ta régularité</h2><span class="meta">16 semaines</span></div>
    <div class="heat-wrap"><div class="heat" aria-hidden="true">${cells}</div></div>
    <p class="small">Chaque case est un jour : plus elle est foncée, plus tu as révisé de cartes.</p>
  </section>
  <section class="block">
    <div class="block-head"><h2>Les 7 prochains jours</h2><span class="meta">cartes prévues</span></div>
    <div class="fc">${fc.map((v, d) => `<div><b>${v}</b><i class="${v ? "" : "zero"}" style="height:${v ? Math.max(4, Math.round(v / max * 80)) : 2}px"></i><small>${esc(dayName(d))}</small></div>`).join("")}</div>
  </section>
  <section class="block">
    <div class="block-head"><h2>Réglages des cartes</h2></div>
    <div class="set-row"><span><strong>Nouvelles cartes par jour</strong><small>5 conseillé. Les cartes à revoir ne sont jamais limitées.</small></span>
      <span class="stepper"><button data-act="newpd" data-d="-1" aria-label="Une de moins">−</button><b>${state.set.newPerDay | 0}</b><button data-act="newpd" data-d="1" aria-label="Une de plus">+</button></span></div>
    <div class="set-col"><span><strong>Cartes « sens → arabe »</strong><small>Le sens est montré, tu dis la phrase en arabe. « Invocations » : seulement pour les textes que tu apprends à dire.</small></span>
      <div class="seg" role="group" aria-label="Cartes sens vers arabe">${reverseOpts.map(([k, l]) => `<button class="seg-b${state.set.reverse === k ? " on" : ""}" data-act="reverse" data-v="${k}" aria-pressed="${state.set.reverse === k}">${l}</button>`).join("")}</div></div>
    <div class="set-list">${toggle("wbw", "Mot à mot sur les réponses", "Le sens de chaque mot arabe sous la réponse.", "c")}${toggle("hidePh", "Masquer la phonétique", "Pour t’entraîner à lire l’arabe.", "c")}</div>
  </section>
  <section class="block">
    <div class="block-head"><h2>Par fiche</h2></div>
    <ul class="rows">${fiches.map(fid => {
      const c = CARD[fid], ids = cardsOfFiche(c);
      let mm = 0, yy = 0, ll = 0;
      ids.forEach(id => { const st = state.cards[id]; if (!st || st.susp) return; if (st.s !== "review") ll++; else if (st.ivl >= 21) mm++; else yy++; });
      return `<li><button class="row-card" data-act="card" data-id="${fid}"><span class="rc-main"><strong>${esc(c.title)}</strong>${stackBar([[mm, "m"], [yy, "y"], [ll, "l"]], ids.length, "sm")}<small>${mm + yy} retenue${mm + yy > 1 ? "s" : ""} sur ${ids.length}</small></span></button></li>`;
    }).join("")}</ul>
    <p class="small">Pour apprendre une fiche bonus, ouvre-la dans l’onglet Fiches et touche « Apprendre cette fiche ».</p>
  </section>
  ${STANDALONE ? `<section class="block"><div class="block-head"><h2>Sauvegarde</h2></div><p class="sub">${esc(lastExportText())}</p><div class="row"><button class="btn btn-ghost" data-act="export">${ICON.down}Sauvegarder</button><button class="btn btn-quiet" data-act="import">${ICON.up}Restaurer</button></div></section>` : ""}`;
}

  const chips = [["prog", "Programme"], ["1", STEPS[1]], ["2", STEPS[2]], ["3", STEPS[3]], ["ar", "Arabe"]];
  let body;
  if (f === "ar") {
    body = `<section class="block"><div class="block-head"><h2>L’alphabet</h2></div>
      <p class="sub">28 lettres, chacune avec un mot que tu récites déjà. Une lettre change de forme selon sa place dans le mot.</p>
      <div class="letters" dir="rtl">${LETTERS.map((x, i) => `<button class="letter${x.hard ? " hard" : ""}" data-act="letter" data-i="${i}"><span class="lg" lang="ar">${x.l}</span><span class="ln" dir="ltr">${esc(x.name)}</span></button>`).join("")}</div>
      <p class="small"><span class="key-hard"></span>Sans équivalent en français : à travailler en priorité.</p>
    </section>
    <section class="block"><div class="block-head"><h2>Les voyelles et les signes</h2></div>${signsInner()}</section>
    <section class="block"><div class="block-head"><h2>Lire la phonétique</h2></div>
      <dl class="legend">
        <div><dt>â · î · oû</dt><dd>voyelles longues : tiens le son</dd></div>
        <div><dt>'</dt><dd>le ع ('ayn), ou une petite coupure (hamza)</dd></div>
        <div><dt>h</dt><dd>ح soufflé ou ه léger : regarde la lettre arabe</dd></div>
        <div><dt>kh · gh</dt><dd>خ comme la jota espagnole · غ comme le r parisien</dd></div>
        <div><dt>th · dh</dt><dd>ث comme think · ذ et ظ comme this</dd></div>
        <div><dt>ch · q</dt><dd>ش comme chat · ق comme un k du fond de la gorge</dd></div>
        <div><dt>ou</dt><dd>se lit « ou », jamais « u »</dd></div>
      </dl>
    </section>`;
  } else {
    let list = f === "prog" ? WEEKS.filter(w => w.ph < 4).flatMap(w => w.cards.map(id => CARD[id])) : CARDS.filter(c => String(c.step) === f);
    list = list.filter((c, i, a) => a.indexOf(c) === i);
    body = `<ul class="rows">${list.map(c => {
      const wn = weekOf(c.id), added = state.added.includes(c.id);
      const tag = c.tier === "prog" ? (wn ? "S" + wn : "") : added ? "Dans mes cartes" : c.tier === "adv" ? "Avancé" : "Bonus";
      const st = c.tier === "prog" && wn ? (wn < state.week ? "done" : wn === state.week ? "now" : "") : added ? "done" : "";
      return `<li><button class="row-card" data-act="card" data-id="${c.id}"><span class="rc-main"><strong>${esc(c.title)}</strong><small>${esc(c.when)}</small></span><span class="tag ${st}">${esc(tag)}</span></button></li>`;
    }).join("")}</ul>`;
  }
  return `
  <section class="hero">
    <p class="eyebrow">Fiches</p>
    <h1>Tous tes textes</h1>
    <div class="row-between"><p class="sub">${CARDS.length} fiches : l’arabe, la phonétique, le sens et le mot à mot.</p><button class="chip${state.set.hidePh ? " on" : ""}" data-act="toggle-ph" aria-pressed="${state.set.hidePh}">${state.set.hidePh ? "Afficher" : "Masquer"} la phonétique</button></div>
  </section>
  <div class="filters" role="group" aria-label="Filtrer les fiches">${chips.map(([k, l]) => `<button class="chip${f === k ? " on" : ""}" data-act="filter" data-f="${k}" aria-pressed="${f === k}">${esc(l)}</button>`).join("")}</div>
  ${body}`;
}
function viewVoiture() {
  const w = WEEKS[state.week - 1];
  const hasPast = state.week > 1 || Object.keys(state.cards).some(id => id.endsWith(":f"));
  const lists = [
    ["semaine", "Ma semaine", w.cards.length ? w.cards.map(id => CARD[id].title).join(" · ") + ". Deux passages, avec le sens." : "Pas de fiche cette semaine : la révision sera jouée à la place."],
    ["revision", "Révision", hasPast ? "Les phrases de tes cartes qui reviennent le plus tôt : tu récites, puis tu entends le sens." : "Disponible dès que tu as commencé tes cartes."],
    ["matin", "Adhkâr du matin", "Âyat al-Koursî, les trois Qoul, Asbahnâ, Sayyid al-istighfâr… Ce que tu ne connais pas encore, je te le fais répéter."],
    ["soir", "Adhkâr du soir", "La même routine, dans sa version du soir."]
  ];
  return `
  <section class="hero">
    <p class="eyebrow">Mode voiture</p>
    <h1>Tout à l’oreille</h1>
    <p class="sub">Choisis avant de démarrer, pose le téléphone, puis n’y touche plus. La voix te guide : tu récites à voix haute, elle te donne le sens. Garde l’écran allumé pendant la séance.</p>
  </section>
  ${tts.ok ? "" : `<p class="warn">La lecture audio n’est pas disponible dans cette fenêtre. Ouvre la page dans Safari ou Chrome pour utiliser le mode voiture.</p>`}
  <ul class="lists">${lists.map(([k, t, d]) => `<li><button class="list-btn" data-act="car" data-list="${k}"${k === "revision" && !hasPast ? " disabled" : ""}>${ICON.play}<span><strong>${esc(t)}</strong><small>${esc(d)}</small></span></button></li>`).join("")}</ul>
  <section class="block"><div class="block-head"><h2>Réglages audio</h2></div>
    <div class="set-list">
      ${toggle("arVoice", "Voix arabe de synthèse", "Pour mémoriser les invocations. Elle peut se tromper : vérifie avec un récitant. Les versets du Coran ne sont jamais lus par cette voix.", "v", !(tts.ok && tts.ar))}
      ${toggle("longPause", "Pauses longues", "Plus de temps pour réciter.", "v")}
      ${toggle("slow", "Débit lent", "Ralentit la voix.", "v")}
    </div>
    <p class="small">${esc(voiceStatus())}</p>
  </section>`;
}
function render() {
  $("#view").innerHTML = ui.tab === "programme" ? viewProgramme() : ui.tab === "cartes" ? viewCartes() : ui.tab === "fiches" ? viewFiches() : ui.tab === "voiture" ? viewVoiture() : viewToday();
  document.querySelectorAll(".tab").forEach(b => { if (b.dataset.tab === ui.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
}

/* ---------- Panneau de détail ---------- */
function renderDetail() {
  const d = ui.detail;
  if (!d) return;
  const head = $("#detail-title"), body = $("#detail-body");
  if (d.type === "card") {
    const c = CARD[d.id], wn = weekOf(c.id);
    head.textContent = c.tier === "prog" && wn ? "Semaine " + wn : STEPS[c.step];
    let learnBox;
    if (inProgram(c.id)) learnBox = `<p class="small">Cette fiche fait partie de ton programme : ses cartes arrivent toutes seules, ${plural(state.set.newPerDay | 0, "nouvelle", "nouvelles")} par jour au maximum.</p>`;
    else {
      const added = state.added.includes(c.id);
      learnBox = `<button class="btn${added ? " btn-quiet" : ""}" data-act="learn" data-id="${c.id}">${added ? "Retirer de mes cartes" : "Apprendre cette fiche"}</button>
        <p class="small">${added ? "Les cartes déjà vues gardent leur progression." : wn ? `Prévue en semaine ${wn} : tu peux commencer ses cartes dès maintenant.` : "Fiche bonus : ses cartes arriveront après celles du programme."}</p>`;
    }
    const ids = cardsOfFiche(c), started = ids.some(id => state.cards[id]);
    const manage = started ? `<section class="block"><div class="block-head"><h2>Les cartes de cette fiche</h2></div><ul class="mg">${ids.map(id => {
      const { i, dir } = parseCid(id), st = state.cards[id], [lab, cls] = stateLabel(st);
      return `<li class="mg-row"><span><strong>Phrase ${i + 1} <small>${dir === "f" ? "arabe → sens" : "sens → arabe"}</small></strong><span class="cs ${cls}">${esc(lab)}</span></span>${st ? `<span class="mg-act"><button class="btn-sm" data-act="susp" data-id="${id}">${st.susp ? "Réactiver" : "Suspendre"}</button><button class="btn-sm" data-act="forget" data-id="${id}">Recommencer</button></span>` : ""}</li>`;
    }).join("")}</ul></section>` : "";
    body.innerHTML = `<section class="block">${cardBlock(c)}</section>${learnBox}${manage}`;
  } else if (d.type === "week") {
    const w = WEEKS[d.n - 1], st = d.n < state.week ? "done" : d.n === state.week ? "now" : "next";
    head.textContent = "Semaine " + w.n;
    body.innerHTML = `
      <p class="eyebrow">Phase ${w.ph} · ${esc(PHASES[w.ph - 1].title)}</p>
      <h2 class="sheet-h">${esc(w.title)}</h2>
      <p class="tip"><strong>Comment l’appliquer.</strong> ${esc(w.tip)}</p>
      ${w.page === "signes" ? `<section class="block">${signsInner()}</section>` : ""}
      ${w.cards.length ? `<section class="block">${w.cards.map(id => cardBlock(CARD[id])).join("")}</section>` : ""}
      ${st === "now" ? "" : `<button class="btn" data-act="goto-week" data-n="${w.n}">${st === "done" ? "Revenir à cette semaine" : "Commencer cette semaine maintenant"}</button>`}`;
  } else if (d.type === "letter") {
    const i = d.i, x = LETTERS[i], n = LETTERS.length;
    const labels = x.forms.length === 2 ? ["Seule", "En fin de mot"] : ["Seule", "Au début", "Au milieu", "À la fin"];
    head.textContent = "L’alphabet";
    body.innerHTML = `
      <div class="letter-hero"><span lang="ar">${x.l}</span><div><h2 class="sheet-h">${esc(x.name)}</h2><p>${esc(x.sound)}</p></div></div>
      <h3 class="mini">Ses formes</h3>
      <div class="forms" dir="rtl">${x.forms.map((f, k) => `<div><span lang="ar">${f}</span><small dir="ltr">${labels[k]}</small></div>`).join("")}</div>
      <h3 class="mini">Dans un mot que tu connais</h3>
      <div class="ex"><p class="ar" lang="ar" dir="rtl">${x.ex}</p><p class="ph">${esc(x.exph)} · ${esc(x.exsrc)}</p></div>
      <div class="row"><button class="btn btn-ghost" data-act="letter" data-i="${(i + n - 1) % n}">Précédente</button><button class="btn btn-ghost" data-act="letter" data-i="${(i + 1) % n}">Suivante</button></div>`;
  } else if (d.type === "settings") {
    head.textContent = "Réglages";
    body.innerHTML = `
      <section class="block"><div class="set-list">
        ${toggle("arVoice", "Voix arabe de synthèse", "Lit les invocations en arabe pour t’aider à les mémoriser. Elle peut se tromper : vérifie ta prononciation avec un récitant. Les versets du Coran ne sont jamais lus par cette voix.", "s", !(tts.ok && tts.ar))}
        ${toggle("slow", "Débit lent", "Ralentit la voix.", "s")}
        ${toggle("longPause", "Pauses longues", "Plus de temps pour réciter en voiture.", "s")}
        ${toggle("hidePh", "Masquer la phonétique", "Pour t’entraîner à lire l’arabe.", "s")}
        ${toggle("wbw", "Mot à mot sur les réponses", "Le sens de chaque mot arabe sous la réponse des cartes.", "s")}
      </div></section>
      <p class="small">${esc(voiceStatus())}</p>
      <section class="block"><div class="block-head"><h2>Ma progression</h2></div>
        <p class="sub" id="sync-note">${esc(syncText())}</p>
        ${STANDALONE ? `<p class="small">${esc(lastExportText())}</p><div class="row"><button class="btn btn-ghost" data-act="export">${ICON.down}Sauvegarder</button><button class="btn btn-quiet" data-act="import">${ICON.up}Restaurer</button></div>` : ""}
      </section>
      ${STANDALONE && !isInstalled() ? `<section class="block install"><div class="block-head"><h2>Installer l’appli</h2></div><p class="sub">Une fois installée, elle s’ouvre depuis l’écran d’accueil et marche sans réseau.</p>${installHelp()}</section>` : ""}
      <section class="block danger">${ui.confirmReset
        ? `<p>Tout effacer et recommencer à la semaine 1 ? Tes cartes repartiront de zéro.</p><div class="row"><button class="btn btn-ghost" data-act="reset-cancel">Annuler</button><button class="btn btn-danger" data-act="reset-go">Oui, recommencer</button></div>`
        : `<button class="btn btn-quiet" data-act="reset-ask">Recommencer le programme</button>`}</section>
      <p class="small">Versets du Coran : texte de référence Tanzil. Invocations : la Citadelle du musulman (Hisn al-Mouslim), avec la source du hadith sur chaque fiche.</p>`;
  }
}

/* ---------- Actions ---------- */
function gotoWeek(n) {
  state.week = clamp(n, 1, LAST);
  state.weekStart = todayKey();
  ui.confirmAdv = false; ui.tab = "aujourdhui";
  closeLayer("detail");
  commit();
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  switch (t.dataset.act) {
    case "tab": ui.tab = t.dataset.tab; ui.confirmAdv = false; render(); window.scrollTo(0, 0); break;
    case "prayer": { const p = dayRec(todayKey()).p.slice(), i = +t.dataset.i; p[i] = p[i] ? 0 : 1; patchToday({ p }); break; }
    case "study": openStudy(); break;
    case "study-close": closeLayer("study"); break;
    case "help-ok": state.seenHelp = true; commit(false); renderStudy(); break;
    case "show": session.shown = true; renderStudy(); break;
    case "grade": answer(+t.dataset.g); break;
    case "undo": undoAnswer(); break;
    case "more-new": { const r = dayRec(todayKey()); r.xn = (r.xn || 0) + 5; state.days[todayKey()] = r; commit(false); showCard(pickNext()); break; }
    case "say": { const { fid, i } = parseCid(t.dataset.id); hush(); speak(linesOf(CARD[fid])[i].ar, "ar", state.set.slow ? 0.7 : 0.85); break; }
    case "car": startCar(t.dataset.list); break;
    case "car-toggle":
      if (player.playing) stopPlay();
      else { if (player.finished) { player.i = 0; player.finished = false; } primeSpeech(); play(); }
      break;
    case "car-next": stepCar(1); break;
    case "car-prev": stepCar(-1); break;
    case "car-close": closeCar(); break;
    case "close": closeLayer(t.dataset.layer); break;
    case "card": openDetail({ type: "card", id: t.dataset.id }); break;
    case "week": openDetail({ type: "week", n: +t.dataset.n }); break;
    case "letter": openDetail({ type: "letter", i: +t.dataset.i }); $("#detail").scrollTop = 0; break;
    case "settings": ui.confirmReset = false; openDetail({ type: "settings" }); break;
    case "goto-week": gotoWeek(+t.dataset.n); break;
    case "eve": ui.eve[t.dataset.id] = t.dataset.v === "1"; refresh(); break;
    case "words": ui.wbw[t.dataset.id] = !ui.wbw[t.dataset.id]; refresh(); break;
    case "listen": listenCard(t.dataset.id, !!ui.eve[t.dataset.id]); break;
    case "learn": {
      const id = t.dataset.id;
      state.added = state.added.includes(id) ? state.added.filter(x => x !== id) : state.added.concat(id);
      commit(); renderDetail();
      toast(state.added.includes(id) ? "Fiche ajoutée à tes cartes." : "Fiche retirée de tes cartes.");
      break;
    }
    case "susp": { const s = state.cards[t.dataset.id]; if (s) { s.susp = !s.susp; commit(); renderDetail(); } break; }
    case "forget": delete state.cards[t.dataset.id]; commit(); renderDetail(); toast("Carte remise à zéro."); break;
    case "newpd": state.set.newPerDay = clamp((state.set.newPerDay | 0) + Number(t.dataset.d), 0, 30); commit(); break;
    case "reverse": state.set.reverse = t.dataset.v; commit(); break;
    case "filter": ui.filter = t.dataset.f; render(); break;
    case "toggle-ph": state.set.hidePh = !state.set.hidePh; commit(); if (ui.detail) renderDetail(); break;
    case "adv-ask": ui.confirmAdv = true; render(); break;
    case "adv-cancel": ui.confirmAdv = false; render(); break;
    case "adv-go":
      if (state.week < LAST) { state.week++; state.weekStart = todayKey(); }
      ui.confirmAdv = false; commit(); window.scrollTo(0, 0);
      break;
    case "hide-install": state.set.hideInstall = true; commit(); break;
    case "install":
      if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; refresh(); }); }
      break;
    case "export": exportData(); break;
    case "import": $("#import-file").click(); break;
    case "reset-ask": ui.confirmReset = true; renderDetail(); break;
    case "reset-cancel": ui.confirmReset = false; renderDetail(); break;
    case "reset-go": {
      const set = state.set, seen = state.seenHelp, lastExport = state.lastExport;
      state = freshState(); state.set = set; state.seenHelp = seen; state.lastExport = lastExport;
      ui.tab = "aujourdhui"; ui.confirmAdv = false;
      closeLayer("detail");
      commit(); window.scrollTo(0, 0);
      break;
    }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "import-file") { if (t.files && t.files[0]) importData(t.files[0]); t.value = ""; return; }
  if (!t.matches || !t.matches("[data-set]")) return;
  state.set[t.dataset.set] = t.checked;
  commit();
  if (ui.detail) renderDetail();
});
document.addEventListener("keydown", e => {
  const onControl = e.target.closest && e.target.closest("button, input, a, select, textarea");
  if (!$("#study").hidden && !e.metaKey && !e.ctrlKey && !e.altKey && !onControl && state.seenHelp) {
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      if (session.current && !session.shown) { session.shown = true; renderStudy(); }
      else if (session.current && session.shown) answer(3);
      return;
    }
    if (/^[1-4]$/.test(e.key) && session.current && session.shown) { answer(Number(e.key)); return; }
    if ((e.key === "z" || e.key === "u") && session.undo) { undoAnswer(); return; }
  }
  if (e.key !== "Escape") return;
  const open = Array.from(document.querySelectorAll(".layer:not([hidden])")).pop();
  if (!open) return;
  if (open.id === "car") closeCar(); else closeLayer(open.id);
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (player.playing) { requestWake(); return; }
  render();
  if (!$("#study").hidden && !session.current) showCard(pickNext());
});

/* ---------- Démarrage ---------- */
$("#brand").innerHTML = ICON.star + "<span>Prière mot à mot</span>";
$("#btn-settings").innerHTML = ICON.gear;
document.querySelectorAll(".js-close").forEach(b => { b.innerHTML = ICON.close; });
$("#study-undo").innerHTML = ICON.undo;
$("#car-prev").innerHTML = ICON.prev;
$("#car-next").innerHTML = ICON.next;
$("#tabs").innerHTML = [["aujourdhui", "Aujourd’hui", ICON.today], ["programme", "Programme", ICON.path], ["cartes", "Cartes", ICON.cards], ["fiches", "Fiches", ICON.book], ["voiture", "Voiture", ICON.car]]
  .map(([k, l, ic]) => `<button class="tab" data-act="tab" data-tab="${k}">${ic}<span>${l}</span></button>`).join("");
if (tts.ok) {
  try { speechSynthesis.addEventListener("voiceschanged", loadVoices); } catch (e) { speechSynthesis.onvoiceschanged = loadVoices; }
  loadVoices();
}
if (STANDALONE) {
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; refresh(); });
  window.addEventListener("appinstalled", () => { installEvt = null; refresh(); });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ("serviceWorker" in navigator && window.isSecureContext) {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) toast("Nouvelle version de l’appli installée.", "Recharger", () => location.reload()); });
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => { /* hors ligne indisponible, l’appli marche quand même */ }); });
  }
}
render();
initSync();
})();
</script>
</body>
</html>
